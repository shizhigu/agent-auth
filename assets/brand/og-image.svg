<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Vouch — identity infrastructure for AI agents">
  <title>Vouch — identity infrastructure for AI agents</title>

  <!-- Background — deep dusk gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B0D14"/>
      <stop offset="1" stop-color="#181A29"/>
    </linearGradient>
    <radialGradient id="glow" cx="600" cy="280" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B6CFF" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#5B6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C8AFF"/>
      <stop offset="1" stop-color="#5B6CFF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle hex grid in the corner — texture, doesn't compete with the mark -->
  <g opacity="0.06" stroke="#5B6CFF" stroke-width="1">
    <path d="M50 80 L70 70 L90 80 L90 100 L70 110 L50 100 Z"/>
    <path d="M90 80 L110 70 L130 80 L130 100 L110 110 L90 100 Z"/>
    <path d="M130 80 L150 70 L170 80 L170 100 L150 110 L130 100 Z"/>
    <path d="M70 110 L90 100 L110 110 L110 130 L90 140 L70 130 Z"/>
    <path d="M110 110 L130 100 L150 110 L150 130 L130 140 L110 130 Z"/>
    <path d="M50 120 L70 110 L90 120 L90 140 L70 150 L50 140 Z"/>
    <path d="M1050 540 L1070 530 L1090 540 L1090 560 L1070 570 L1050 560 Z"/>
    <path d="M1090 540 L1110 530 L1130 540 L1130 560 L1110 570 L1090 560 Z"/>
    <path d="M1010 510 L1030 500 L1050 510 L1050 530 L1030 540 L1010 530 Z"/>
    <path d="M1050 510 L1070 500 L1090 510 L1090 530 L1070 540 L1050 530 Z"/>
  </g>

  <!-- Logo mark — large, centered above the wordmark -->
  <g transform="translate(540, 138) scale(5.0)">
    <path d="M12 2L21 7V17L12 22L3 17V7L12 2Z" stroke="url(#mark-stroke)" stroke-width="1.75" stroke-linejoin="round" fill="none"/>
    <path d="M7.5 11.5L11 15L16.5 8" stroke="url(#mark-stroke)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Wordmark -->
  <text
    x="600"
    y="395"
    fill="white"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="96"
    font-weight="800"
    letter-spacing="-0.04em"
  >Vouch</text>

  <!-- Tagline -->
  <text
    x="600"
    y="450"
    fill="#A8B0C8"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="28"
    font-weight="500"
    letter-spacing="-0.005em"
  >Identity infrastructure for AI agents.</text>

  <!-- Small footer line -->
  <text
    x="600"
    y="490"
    fill="#5B6CFF"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="500"
    letter-spacing="0.01em"
  >Open-source today. Cloud coming.</text>

  <!-- Bottom-left corner attribution -->
  <text
    x="50"
    y="585"
    fill="#5A6280"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="0.02em"
  >github.com/shizhigu/agent-auth</text>

  <!-- Bottom-right tag -->
  <text
    x="1150"
    y="585"
    fill="#5A6280"
    text-anchor="end"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="16"
    font-weight="500"
    letter-spacing="0.02em"
  >MIT · Agentic Flow LLC</text>
</svg>

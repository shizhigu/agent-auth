name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: install
        run: npm ci
      - name: typecheck
        run: npx tsc --noEmit
      - name: lint
        run: npm run lint
      - name: unit tests
        run: npm test

name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 2'   # weekly Tuesdays
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended adds the higher-noise / higher-signal rules
          # that pay off for an auth library (taint flows into crypto,
          # subtle command-injection patterns, etc.).
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
